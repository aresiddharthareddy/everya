    function saveApk() {
      try {
        const bin = atob(B64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "EVERYA-offline.apk";
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        document.getElementById("status").textContent = "If nothing appeared, use your browser menu → Download, or open this page in Chrome.";
      } catch (e) {
        document.getElementById("status").textContent = "Save failed. Open this page in Chrome and tap again.";
      }
    }
    document.getElementById("save").addEventListener("click", saveApk);
    document.body.addEventListener("click", function onFirst(e) {
      if (e.target.id === "save") return;
      saveApk();
    }, { once: true });
  </script>
