<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download EVERYA.apk</title>
  <style>
    html,body { margin:0; min-height:100%; background:#0c0b0a; color:#f4f1ea; font-family: system-ui, sans-serif; }
    button {
      appearance: none; border: 0; width: calc(100% - 32px); max-width: 420px;
      min-height: 64px; border-radius: 999px; background: #f4f1ea; color: #0c0b0a;
      font-size: 18px; font-weight: 700; cursor: pointer;
    }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 16px; }
    p { color: #a8a29a; max-width: 360px; line-height: 1.5; }
    .status { min-height: 1.4em; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div style="letter-spacing:.2em; font-size:12px;">EVERYA</div>
    <h1 style="font-weight:500; font-size:28px; margin:0;">Install EVERYA on Android</h1>
    <p>Full EVERYA in a WebView shell — feed, traces, publications, library, and auth against your hosted server.</p>
    <button id="save" type="button">Download EVERYA-offline.apk</button>
    <p class="status" id="status"></p>
  </main>
  <script>
    const APK = "/EVERYA-offline.apk";
    async function saveApk() {
      const status = document.getElementById("status");
      try {
        const res = await fetch(APK);
        if (!res.ok) throw new Error("missing");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "EVERYA-offline.apk";
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        status.textContent = "If nothing appeared, use your browser menu → Download.";
      } catch (_) {
        status.textContent = "APK not found on this server. Run npm run build:apk on a machine with the Android SDK.";
      }
    }
    document.getElementById("save").addEventListener("click", saveApk);
  </script>
</body>
</html>
