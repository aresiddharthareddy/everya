<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EVERYA — Offline</title>
  <style>
    :root { --bg:#0c0b0a; --fg:#f4f1ea; --muted:#a8a29a; --line:#2a2825; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); text-align:center; }
    main { max-width:360px; }
    h1 { font-size:1.35rem; font-weight:600; margin:0 0 10px; }
    p { color:var(--muted); line-height:1.55; font-size:15px; margin:0 0 20px; }
    button { appearance:none; border:0; border-radius:999px; min-height:48px; padding:0 22px; background:var(--fg); color:var(--bg); font-size:15px; font-weight:700; cursor:pointer; }
    code { font-size:12px; word-break:break-all; display:block; margin-top:14px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div style="letter-spacing:.18em;font-size:11px;margin-bottom:18px;">EVERYA</div>
    <h1>Can’t reach EVERYA</h1>
    <p>This app loads the full EVERYA web product. Check your internet connection, then try again.</p>
    <button type="button" onclick="EveryA.retry()">Retry</button>
    <code id="url"></code>
  </main>
  <script>
    try { document.getElementById("url").textContent = EveryA.getAppUrl(); } catch (_) {}
  </script>
</body>
</html>
