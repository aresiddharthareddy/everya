erYa connections and interests.</p></div><span>${visible.length} people</span></div><nav class="network-filter-row" aria-label="Filter people suggestions">${filters.map(filter=>`<button type="button" class="network-filter ${state.networkFilter===filter?'active':''}" aria-pressed="${state.networkFilter===filter}" data-network-filter="${escapeHtml(filter)}">${escapeHtml(filter)}${filter==='Mutual friends'?`<span>${profiles.filter(profile=>profile.mutuals.length>0).length}</span>`:''}</button>`).join('')}</nav><section class="network-card-grid" aria-label="Suggested people">${cards}</section>`}function communitiesView(){return `${pageHeading('Communities','Find your people around shared topics and interests.')}<section class="card list-card"><div class="section-head"><strong>Explore communities</strong><span class="pill">${communities.length} communities</span></div>${communities.map(community=>`<div class="list-row"><span class="file-icon">${community.icon}</span><div class="list-detail"><strong>${community.name}</strong><small>${formatMetric(community.members+(state.joinedCommunities.has(community.id)?1:0))} members · ${community.topic} · ${community.activity}</small><p>${community.description}</p></div><button class="follow-button ${state.joinedCommunities.has(community.id)?'following':''}" data-community-join="${community.id}">${state.joinedCommunities.has(community.id)?'Joined':'Join'}</button></div>`).join('')}</section>`}function bookmarksView(){const saved=posts.filter(p=>state.bookmarks.has(p.id));return `${pageHeading('Bookmarks','Your saved articles, documents, and technical references.')}<div class="feed-controls"><div class="feed-tabs"><button class="feed-tab active">All saved</button><button class="feed-tab">Articles</button><button class="feed-tab">Documents</button></div><button class="text-button">Organize</button></div>${saved.length?saved.map(postCard).join(''):`<section class="card empty-state">Save a post to keep it here for later.</section>`}`}

function metricValue(value){const source=String(value??'0').trim().toLowerCase(),number=parseFloat(source.replace(/,/g,''));if(!Number.isFinite(number))return 0;return number*(source.includes('m')?1000000:source.includes('k')?1000:1)}
function formatMetric(value){const number=Number(value)||0;return number>=1000000?(number/1000000).toFixed(1)+'m':number>=1000?(number/1000).toFixed(1)+'k':String(number)}
function postPopularity(post){return (post.likes||0)*3+metricValue(post.views)*.02+(post.tags||[]).length*8}
function tracePopularity(trace){return (trace.likes||0)*3+(trace.views||0)*.02+(trace.topics||[]).length*12}

ading"><h2 class="side-title">Suggestions</h2><button class="text-button" data-view="network">See all</button></div>${suggestions.length?suggestions.map(person=>`<div class="mini-person">${avatar(person[0],person[3])}<div class="mini-person-info"><strong>${escapeHtml(person[1])}</strong><small>${escapeHtml(person[2])}</small></div><button class="follow-button ${state.following.has(person[1])?'following':''}" data-follow="${escapeHtml(person[1])}">${state.following.has(person[1])?'Following':'Follow'}</button></div>`).join(''):'<p class="side-empty">You’re connected with everyone here.</p>'}</section><section class="card side-card channels-card"><div class="side-heading"><h2 class="side-title">Channels</h2><span class="side-kicker">JOIN THE CHAT</span></div>${channels.map(channel=>`<div class="channel-mini-row"><button type="button" class="channel-mini-open" data-channel-open="${channel.id}"><span class="channel-mini-mark">#</span><span><strong>${escapeHtml(channel.name)}</strong><small>${formatMetric(channel.members+(state.joinedChannels.has(channel.id)?1:0))} members · ${escapeHtml(channel.topic)}</small></span></button><button type="button" class="channel-join ${state.joinedChannels.has(channel.id)?'joined':''}" data-channel-join="${channel.id}">${state.joinedChannels.has(channel.id)?'Joined':'Join'}</button></div>`).join('')}<button class="text-button side-card-link" data-view="channels">Explore channels →</button></section><section class="card side-card plans-card"><div class="side-heading"><h2 class="side-title">Plans &amp; offers</h2><span class="side-kicker">COMMUNITY</span></div><div class="plan-offer"><small>MEMBER OFFER</small><strong>Get more from your community</strong><p>Keep projects organized, follow expert conversations, and understand your reach.</p></div><div class="plan-row"><span>Free</span><strong>₹0</strong></div><div class="plan-row"><span>EverYa Pro</span><strong>₹299 <small>/ month</small></strong></div><button class="plan-cta" data-pro">${state.pro?'View plan':'Explore plans'}</button></section><div class="side-footer">About · Guidelines · Privacy · Terms<br>© 2026 EverYa</div>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function traceCard(trace){return `<article class="card trace-card"><div class="trace-card-top"><span class="trace-repo-icon">⌘</span><span class="trace-label">TRACE REPOSITORY</span><span class="trace-visibility">Public</span></div><h2><button type="button" data-trace-open="${trace.id}">${escapeHtml(trace.name)}</button></h2><p>${escapeHtml(trace.description)}</p><div class="trace-topics">${trace.topics.map(topic=>`<span class="tag">${escapeHtml(topic)}</span>`).join('')}</div><div class="trace-card-stats"><span>♥ ${formatMetric(trace.likes)} likes</span><span>◉ ${formatMetric(trace.views)} views</span><span>${trace.documents.length} docs</span></div><div class="trace-card-foot"><span>By ${escapeHtml(trace.owner)} · ${escapeHtml(trace.updated)}</span><button type="button" data-trace-open="${trace.id}">Open repository →</button></div></article>`}

function channelTraceModal(channel){var html='<form id="channelTraceForm" class="channel-form"><input type="hidden" name="channelId" value="'+escapeHtml(channel.id)+'"><p class="channel-form-help">Share a Trace project with everyone in '+escapeHtml(channel.name)+'.</p><label>Choose a Trace<select id="channelTraceSelect" required>'+traces.map(function(trace){return '<option value="'+escapeHtml(trace.id)+'">'+escapeHtml(trace.name)+'</option>'}).join('')+'</select></label><label>Add a note<textarea id="channelTraceNote" maxlength="400" placeholder="What should members know about this project?"></textarea></label><div class="channel-form-actions"><button type="button" class="channel-action" data-close>Cancel</button><button type="submit" class="channel-action primary">Share Trace</button></div></form>';showModal('Share a Trace',html)}
channelsView=function(){var channel=channels.find(function(item){return item.id===state.activeChannel});if(channel)return channelRoomView(channel);var tabs=['Joined','Invited','Explore'],joined=channels.filter(function(item){return state.joinedChannels.has(item.id)}),invited=state.channelInvitations,explore=channels.filter(function(item){return !state.joinedChannels.has(item.id)&&!invited.some(function(invitation){return invitation.channelId===item.id})}),content='';if(state.channelTab==='Joined')content=joined.length?'<div class="channel-card-grid">'+joined.map(function(item){return channelCard(item,'Joined')}).join('')+'</div>':'<section class="card channel-empty"><strong>You have not joined a channel yet</strong><p>Explore a topic and join the conversation. Members can chat and share files or Trace projects.</p><button type="button" class="channel-action primary" data-channel-tab="Explore">Explore channels</button></section>';else if(state.channelTab==='Invited')content=invited.length?'<div class="channel-invitation-list">'+invited.map(channelInvitationCard).join('')+'</div>':'<section class="card channel-empty"><strong>No channel invitations</strong><p>Invitations from people in your network will appear here.</p></section>';else content=explore.length?'<div class="channel-card-grid">'+explore.map(function(item){return channelCard(item,'Explore')}).join('')+'</div>':'<section class="card channel-empty"><strong>You have explored every channel</strong><p>Join a channel to start chatting.</p></section>';var html=pageHeading('Channels','Join a shared chat and exchange ideas, files, and Trace projects.')+'<section class="channel-hub-intro"><span class="channel-hub-mark">#</span><div><strong>Conversations around what you care about.</strong><p>Join a channel to chat with peers and share media, documents, and Traces.</p></div><div class="channel-hub-count"><strong>'+joined.length+'</strong><small>joined</small></div></section><nav class="channel-tabs" aria-label="Channel sections">'+tabs.map(function(tab){var count=tab==='Joined'?joined.length:tab==='Invited'?invited.length:explore.length;return '<button type="button" class="channel-tab '+(state.channelTab===tab?'active':'')+'" data-channel-tab="'+tab+'" aria-pressed="'+(state.channelTab===tab)+'">'+tab+'<span>'+count+'</span></button>'}).join('')+'</nav><section class="channel-section"><div class="channel-section-head"><div><h2>'+escapeHtml(state.channelTab==='Joined'?'Channels you joined':state.channelTab==='Invited'?'Channel invitations':'Explore channels')+'</h2><p>'+escapeHtml(state.channelTab==='Joined'?'Open a channel to take part in the conversation.':state.channelTab==='Invited'?'Accept an invitation to join a peer conversation.':'Find a topic and join its shared chat.')+'</p></div></div>'+content+'</section>' ;return html};
document.addEventListener('click',function(e){var button=e.target.closest('[data-channel-tab],[data-channel-open],[data-channel-directory],[data-channel-join],[data-channel-accept],[data-channel-decline],[data-channel-settings],[data-channel-leave],[data-channel-invite],[data-channel-share-trace],[data-channel-upload],[data-channel-trace-open]');if(!button)return;if(button.hasAttribute('data-channel-tab')){state.channelTab=button.dataset.channelTab;state.activeChannel=null;render()}else if(button.hasAttribute('data-channel-open')){state.activeChannel=button.dataset.channelOpen;state.view='channels';render();channelScrollBottom()}else if(button.hasAttribute('data-channel-directory')){state.activeChannel=null;render()}else if(button.hasAttribute('data-channel-accept')){var invite=state.channelInvitations.find(function(item){return item.id===button.dataset.channelAccept});if(invite){state.joinedChannels.add(invite.channelId);state.channelInvitations=state.channelInvitations.filter(function(item){return item.id!==invite.id});state.channelTab='Joined';state.activeChannel=null;render();toast('Invitation accepted. Channel added to Joined.')}}else if(button.hasAttribute('data-channel-decline')){state.channelInvitations=state.channelInvitations.filter(function(item){return item.id!==button.dataset.channelDecline});render();toast('Invitation declined')}else if(button.hasAttribute('data-channel-join')){var id=button.dataset.channelJoin;state.joinedChannels.add(id);state.channelTab='Joined';state.activeChannel=id;state.view='channels';render();toast('You joined '+(channels.find(function(item){return item.id===id})||{}).name);channelScrollBottom()}else if(button.hasAttribute('data-channel-settings')){var item=channels.find(function(channel){return channel.id===button.dataset.channelSettings});if(item)channelSettingsModal(item)}else if(button.hasAttribute('data-channel-leave')){state.joinedChannels.delete(button.dataset.channelLeave);state.channelNotifications.delete(button.dataset.channelLeave);state.activeChannel=null;state.channelTab='Joined';closeModal();render();toast('You left the channel')}else if(button.hasAttribute('data-channel-invite')){var item=channels.find(function(channel){return channel.id===button.dataset.channelInvite});if(item)channelInviteModal(item)}else if(button.hasAttribute('data-channel-share-trace')){var item=channels.find(function(channel){return channel.id===button.dataset.channelShareTrace});if(item&&state.joinedChannels.has(item.id))channelTraceModal(item);else toast('Join this channel before sharing a Trace')}else if(button.hasAttribute('data-channel-upload')){var input=document.getElementById('channelFileInput');if(input){input.dataset.mode=button.dataset.channelUpload;input.accept=button.dataset.channelUpload==='media'?'image/*,video/*,audio/*,.mp4,.mov,.webm,.m4v':'application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.zip';input.click()}}else if(button.hasAttribute('data-channel-trace-open')){var trace=traces.find(function(item){return item.id===button.dataset.channelTraceOpen});if(trace){trace.views++;state.activeTrace=trace.id;state.activeChannel=null;state.view='traces';render()}}e.preventDefault();e.stopImmediatePropagation()},true);
function channelScrollBottom(){requestAnimationFrame(function(){var log=document.getElementById('channelChatLog');if(log)log.scrollTop=log.scrollHeight})}

ate.activeChannel=id;state.view='channels';render();channelScrollBottom();toast('Trace shared with channel members');e.stopImmediatePropagation();return}},true);
document.addEventListener('change',function(e){if(e.target.id!=='channelFileInput')return;var input=e.target,file=input.files&&input.files[0],channel=channels.find(function(item){return item.id===state.activeChannel});if(!file||!channel||!state.joinedChannels.has(channel.id)){input.value='';return}if(file.size>25*1024*1024){toast('Choose a file smaller than 25 MB');input.value='';return}var reader=new FileReader(),kind=file.type.indexOf('image/')===0?'image':file.type.indexOf('video/')===0?'video':file.type.indexOf('audio/')===0?'audio':'document';reader.onload=function(){channel.messages.push({author:'Vinay Nalli',initials:'VN',tone:'green',time:'Now',text:'',attachment:{name:file.name,mime:file.type||'File',size:file.size,data:reader.result,kind:kind},mine:true});render();channelScrollBottom();toast('File shared with channel members')};reader.readAsDataURL(file);input.value=''},true);render();
