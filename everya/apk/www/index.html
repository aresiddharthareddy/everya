<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf9" />
  <title>EVERYA</title>
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --line:#d6d3d1; --card:#fff; --surface:#f5f5f4; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
    a { color:inherit; text-decoration:none; }
    header { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; height:52px; padding:0 16px; border-bottom:1px solid var(--line); background:rgba(250,250,249,.95); }
    .brand { letter-spacing:.18em; font-size:12px; font-weight:650; }
    .icon-btn { position:relative; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; }
    .badge-count { position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:#1c1917; color:#fafaf9; font-size:10px; align-items:center; justify-content:center; }
    main { max-width:720px; margin:0 auto; padding:20px 16px 24px; }
    .banner { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:12px; color:var(--muted); margin-bottom:16px; }
    .page-title { font-family:Georgia,serif; font-weight:500; letter-spacing:-.03em; font-size:clamp(1.6rem,5vw,2.2rem); margin:0 0 8px; line-height:1.15; }
    .section { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:24px 0 10px; }
    .lede, .excerpt { color:var(--muted); line-height:1.6; font-size:15px; margin:0; }
    .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .card { display:block; padding:16px 0; border-bottom:1px solid var(--line); }
    .card.flat { padding:14px; border:1px solid var(--line); border-radius:14px; margin-bottom:10px; background:var(--card); }
    .card.read { opacity:.65; }
    .title { font-family:Georgia,serif; font-size:1.25rem; line-height:1.25; margin:4px 0; }
    .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:1px solid var(--line); margin-bottom:6px; }
    .row, .stack { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
    .stack { flex-direction:column; }
    .btn, .chip { appearance:none; display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:0 16px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
    .btn.solid, .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .chip { font-size:12px; min-height:32px; }
    .input { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; background:var(--card); margin:8px 0; }
    .input.tall { min-height:140px; resize:vertical; }
    .tree { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card); }
    .tree-item { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; }
    .tree-item:last-child { border-bottom:0; }
    .tree-item small { color:var(--muted); }
    .body { font-family:Georgia,serif; font-size:1.05rem; line-height:1.75; margin-top:16px; }
    .body h1,.body h2,.body h3 { font-family:ui-sans-serif,system-ui; }
    .body pre, .body code { font-family:ui-monospace,monospace; font-size:.86em; background:var(--surface); }
    .body pre { padding:12px; border-radius:10px; overflow:auto; }
    .body blockquote { border-left:3px solid var(--fg); padding-left:14px; color:var(--muted); }
    .comment { padding:12px 0; border-top:1px solid var(--line); font-size:14px; }
    .comment .between { justify-content:space-between; width:100%; }
    .link-btn { background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; padding:4px 8px; min-height:32px; }
    .link-btn.danger { color:#b91c1c; }
    .contributors { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    .contributors small { font-weight:400; opacity:.8; }
    .read-progress { position:fixed; top:52px; left:0; height:2px; width:0; background:var(--fg); z-index:25; transition:width .1s linear; }
    .doc-nav { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; margin:24px 0; padding-top:16px; border-top:1px solid var(--line); font-size:13px; }
    .nav-link { color:var(--muted); }
    .nav-link.center { text-align:center; font-weight:600; color:var(--fg); }
    .nav-link.right { text-align:right; }
    .tree-item.draft { background:var(--surface); }
    .stats { display:flex; gap:16px; font-size:13px; color:var(--muted); margin:12px 0; }
    textarea { width:100%; min-height:88px; border:1px solid var(--line); border-radius:12px; padding:10px; font:inherit; background:var(--card); margin:8px 0; }
    nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; border-top:1px solid var(--line); background:rgba(255,255,255,.96); padding-bottom:env(safe-area-inset-bottom); }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:56px; font-size:10px; color:var(--muted); }
    .tab span { font-size:16px; }
    .tab.on { color:var(--fg); font-weight:600; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#/">EVERYA</a>
    <a class="icon-btn" href="#/notifications" aria-label="Notifications">
      🔔
      <span id="notif-badge" class="badge-count" style="display:none"></span>
    </a>
  </header>
  <main id="app"></main>
  <nav id="tabs" class="tabs"></nav>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
